<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка оценок CQA</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1d2330;--muted:#677084;--line:#dfe3ea;--accent:#2457d6;--ok:#1d8a4e;--bad:#c23b3b;--na:#7b6cd9;--hl:#fff3c4;--op:#eaf1ff;--cl:#f2f4f7;--sys:#f4efff}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--panel:#1c2028;--text:#e6e9ef;--muted:#98a1b3;--line:#2c323d;--accent:#7aa2ff;--ok:#4cc38a;--bad:#ff7b7b;--na:#b3a6ff;--hl:#4a4020;--op:#1f2a44;--cl:#22262e;--sys:#2a2440}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0 8px 0 0}select,input,textarea,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.5;cursor:default}
main{display:grid;grid-template-columns:260px minmax(0,1fr) 420px;height:calc(100vh - 54px)}
.col{overflow:auto;border-right:1px solid var(--line)}#list .item{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
#list .item.active{background:var(--op)}#list .meta{color:var(--muted);font-size:12px}.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;border:1px solid var(--line);margin-left:4px}
.badge.rev{color:var(--ok);border-color:var(--ok)}.badge.err{color:var(--bad);border-color:var(--bad)}
#chat{padding:14px}.turn{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:6px;background:var(--cl)}
.turn.OPERATOR{background:var(--op)}.turn.SYSTEM,.turn.BOT{background:var(--sys)}.turn.hl{outline:2px solid #d9a400;background:var(--hl)}
.turn .n{font-weight:600;color:var(--muted)}.turn .who{font-size:12px;color:var(--muted)}.turn .txt{white-space:pre-wrap;word-break:break-word}
#form{padding:12px}.crit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel)}
.crit h3{font-size:13px;margin:0 0 6px;display:flex;justify-content:space-between;gap:6px}.crit h3 small{color:var(--muted);font-weight:400}
.crit .row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.crit textarea{width:100%;min-height:44px;resize:vertical}
.crit input.ev{width:120px}.model{font-size:12px;color:var(--muted);margin-bottom:6px}.diff{color:var(--bad);font-weight:600}
.scores{display:flex;gap:14px;margin:4px 0 10px;font-size:13px}.scores b{font-size:16px}.actions{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:1}
#status{color:var(--muted);font-size:12px;margin-left:auto}.empty{color:var(--muted);padding:30px;text-align:center}
@media (max-width:1100px){main{grid-template-columns:200px 1fr;height:auto}#formcol{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1>Проверка оценок</h1>
  <label>Набор <select id="dataset"></select></label>
  <label>Ответы модели <select id="preds"><option value="">— нет —</option></select></label>
  <input id="search" placeholder="Поиск по ID" size="12">
  <select id="lang"><option value="">Все языки</option><option>RU</option><option>KZ</option><option>EN</option></select>
  <label><input type="checkbox" id="onlyOpen"> только непроверенные</label>
  <span id="status"></span>
</header>
<main>
  <div class="col" id="list"></div>
  <div class="col" id="chat"><div class="empty">Положите файлы с диалогами (JSON) в папку <code>datasets/</code>.</div></div>
  <div class="col" id="formcol"><div id="form"></div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const S={checklist:[],convs:[],preds:{},labels:{},cur:null,dirty:false};
const api=async(path,opt)=>{const r=await fetch(path,opt);const j=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw new Error(j.error||r.statusText);return j;};
const label=v=>v===true?'Да':v===false?'Нет':v===null?'N/A':String(v);
const status=t=>$('#status').textContent=t;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function init(){
  S.checklist=await api('/api/checklist');
  const ds=await api('/api/datasets');
  $('#dataset').innerHTML=ds.map(d=>`<option value="${esc(d.name)}">${esc(d.name)} (${d.count})${d.error?' ⚠':''}</option>`).join('');
  const pf=await api('/api/prediction-files');
  $('#preds').innerHTML='<option value="">— нет —</option>'+pf.map(f=>`<option>${esc(f)}</option>`).join('');
  const saved=JSON.parse(localStorage.getItem('cqa-view')||'{}');
  if(saved.dataset&&ds.some(d=>d.name===saved.dataset))$('#dataset').value=saved.dataset;
  if(saved.preds&&pf.includes(saved.preds))$('#preds').value=saved.preds;
  else{const guess=pf.find(f=>f.includes(($('#dataset').value||'').replace('.json','')));if(guess)$('#preds').value=guess;}
  if(ds.length)await loadDataset();
}
function remember(){try{localStorage.setItem('cqa-view',JSON.stringify({dataset:$('#dataset').value,preds:$('#preds').value}));}catch{}}
async function loadDataset(){
  const name=$('#dataset').value;if(!name)return;remember();status('загрузка…');
  S.convs=await api('/api/dataset?name='+encodeURIComponent(name));
  S.labels=await api('/api/labels?name='+encodeURIComponent(name));
  await loadPreds();
  renderList();if(S.convs.length)select(S.convs[0].id);status('');
}
async function loadPreds(){const f=$('#preds').value;remember();S.preds=f?await api('/api/predictions?file='+encodeURIComponent(f)):{};}
function visible(){
  const q=$('#search').value.trim().toLowerCase(),lang=$('#lang').value,open=$('#onlyOpen').checked;
  return S.convs.filter(c=>(!q||c.id.toLowerCase().includes(q))&&(!lang||c.language===lang)&&(!open||!S.labels[c.id]?.reviewed));
}
function renderList(){
  const rev=S.convs.filter(c=>S.labels[c.id]?.reviewed).length;
  status(`проверено ${rev}/${S.convs.length}`);
  $('#list').innerHTML=visible().map(c=>{
    const p=S.preds[c.id],l=S.labels[c.id];
    const ps=p?.status==='ok'?p.score.final_score:p?'ошибка':'–';
    return `<div class="item ${S.cur?.id===c.id?'active':''}" data-id="${esc(c.id)}"><div>${esc(c.id)}${l?.reviewed?'<span class="badge rev">проверено</span>':''}${c.error?'<span class="badge err">ошибка в записи</span>':''}${p?.score?.critical_flag?'<span class="badge err">грубая ошибка</span>':''}</div><div class="meta">${esc(c.language)} · ${esc(c.channel)} · модель ${ps}</div></div>`;}).join('')||'<div class="empty">Нет диалогов</div>';
}
function formFrom(c){
  const l=S.labels[c.id],p=S.preds[c.id];
  const pc=p?.status==='ok'?Object.fromEntries(p.criteria.map(x=>[x.criterion_id,x])):{};
  const out={};
  for(const k of S.checklist){const src=l?.criteria?.[k.code]||pc[k.code];out[k.code]=src?{value:src.value,rationale:src.rationale||'',evidence_turns:[...(src.evidence_turns||[])]}:{value:k.allowed[0],rationale:'',evidence_turns:[]};}
  return out;
}
function select(id){
  if(S.dirty&&!confirm('Несохранённые изменения будут потеряны. Продолжить?'))return;
  const c=S.convs.find(x=>x.id===id);if(!c)return;S.cur=c;S.form=formFrom(c);S.dirty=false;
  renderList();renderChat();renderForm();
}
function renderChat(hl=[]){
  const c=S.cur;if(!c)return;
  $('#chat').innerHTML=(c.error?`<div class="crit diff">Запись не может быть оценена: ${esc(c.error)}</div>`:'')+c.turns.map(t=>`<div class="turn ${esc(t.speaker)} ${hl.includes(t.n)?'hl':''}" id="t${t.n}"><div class="n">[${t.n}]</div><div><div class="who">${esc(t.speaker)}${t.ts?' · '+esc(t.ts):''}</div><div class="txt">${esc(t.text)}</div></div></div>`).join('');
}
async function renderForm(){
  const c=S.cur,p=S.preds[c.id],l=S.labels[c.id];
  const pc=p?.status==='ok'?Object.fromEntries(p.criteria.map(x=>[x.criterion_id,x])):{};
  const scoreModel=p?.status==='ok'?p.score.final_score:(p?'ошибка: '+esc(p.error):'–');
  $('#form').innerHTML=`<div class="actions">
      <button class="primary" id="save" title="Ctrl+S">Сохранить как проверенное</button>
      <button id="fill" ${p?.status==='ok'?'':'disabled'}>Заполнить из ответа модели</button>
      <button id="run">Оценить этот диалог моделью</button>
      <button id="next">Следующий непроверенный →</button></div>
    <div class="scores"><span>Наша оценка <b id="lscore">…</b></span><span>Оценка модели <b>${scoreModel}</b></span><span>${l?(l.reviewed?'проверено':'черновик')+' · '+esc(l.updated||''):'ещё не размечено'}</span></div>`+
    S.checklist.map(k=>{const f=S.form[k.code],m=pc[k.code];const differs=m&&JSON.stringify(m.value)!==JSON.stringify(f.value);
      return `<div class="crit" data-code="${k.code}"><h3><span>${k.number}. ${esc(k.title)}</span><small>${k.weight?('вес '+k.weight):'флаг'}</small></h3>
      <div class="row"><select class="val">${k.allowed.map(v=>`<option value='${JSON.stringify(v)}' ${JSON.stringify(v)===JSON.stringify(f.value)?'selected':''}>${label(v)}</option>`).join('')}</select>
      <input class="ev" value="${esc(f.evidence_turns.join(', '))}" placeholder="реплики, напр. 3, 5" title="номера реплик-доказательств"></div>
      ${m?`<div class="model ${differs?'diff':''}">модель: ${label(m.value)} — ${esc(m.rationale)} [${m.evidence_turns.join(', ')}]</div>`:''}
      <textarea class="rat" placeholder="Обоснование">${esc(f.rationale)}</textarea></div>`;}).join('');
  $('#save').onclick=save;$('#next').onclick=nextOpen;$('#run').onclick=runModel;
  $('#fill').onclick=()=>{for(const x of p.criteria)S.form[x.criterion_id]={value:x.value,rationale:x.rationale,evidence_turns:[...x.evidence_turns]};S.dirty=true;renderForm();};
  for(const el of document.querySelectorAll('.crit[data-code]')){
    const code=el.dataset.code;
    el.querySelector('.val').onchange=e=>{S.form[code].value=JSON.parse(e.target.value);S.dirty=true;const m=pc[code],hint=el.querySelector('.model');if(m&&hint)hint.classList.toggle('diff',JSON.stringify(m.value)!==JSON.stringify(S.form[code].value));updateScore();};
    el.querySelector('.ev').oninput=e=>{S.form[code].evidence_turns=e.target.value.split(/[^0-9]+/).filter(Boolean).map(Number);S.dirty=true;renderChat(S.form[code].evidence_turns);};
    el.querySelector('.rat').oninput=e=>{S.form[code].rationale=e.target.value;S.dirty=true;};
    el.onmouseenter=()=>renderChat(S.form[code].evidence_turns);
  }
  updateScore();
}
async function updateScore(){
  const values=Object.fromEntries(Object.entries(S.form).map(([k,v])=>[k,v.value]));
  try{const r=await api('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values})});$('#lscore').textContent=r.final_score??'—';}catch(e){$('#lscore').textContent='?';}
}
async function save(){
  const c=S.cur;if(!c)return;
  try{S.labels[c.id]=await api('/api/labels?name='+encodeURIComponent($('#dataset').value),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:c.id,criteria:S.form,reviewed:true})});
    S.dirty=false;renderList();renderForm();status('сохранено: '+c.id);}catch(e){alert('Не удалось сохранить: '+e.message);}
}
function nextOpen(){
  const list=S.convs,i=list.findIndex(c=>c.id===S.cur?.id);
  const n=[...list.slice(i+1),...list.slice(0,i)].find(c=>!S.labels[c.id]?.reviewed);if(n)select(n.id);else status('все диалоги проверены');
}
async function runModel(){
  const c=S.cur;const b=$('#run');b.disabled=true;b.textContent='Оценка… (может занять минуту)';
  try{S.preds[c.id]=await api(`/api/evaluate?name=${encodeURIComponent($('#dataset').value)}&id=${encodeURIComponent(c.id)}`,{method:'POST'});renderList();renderForm();}
  catch(e){alert('Ошибка модели: '+e.message);b.disabled=false;b.textContent='Оценить этот диалог моделью';}
}
$('#dataset').onchange=loadDataset;$('#preds').onchange=async()=>{await loadPreds();renderList();if(S.cur)select(S.cur.id);};
$('#search').oninput=renderList;$('#lang').onchange=renderList;$('#onlyOpen').onchange=renderList;
$('#list').onclick=e=>{const it=e.target.closest('.item');if(it)select(it.dataset.id);};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();}});
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue='';}});
init().catch(e=>status('ошибка: '+e.message));
</script>
</body>
</html>
