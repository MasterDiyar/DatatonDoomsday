<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль качества чатов</title>
<style>
:root{
  --bg:#f4f6f5; --panel:#ffffff; --panel-2:#f8faf9; --text:#17221d; --muted:#5f6e67; --line:#e1e7e4;
  --accent:#16643f; --accent-soft:#e3f1ea; --accent-text:#ffffff;
  --client:#eef1f0; --operator:#e3f1ea; --system:#f3eefc; --system-text:#5b4b8a;
  --good:#1b7f4b; --good-soft:#e2f4ea; --warn:#a46200; --warn-soft:#fff3dc; --bad:#b42318; --bad-soft:#fdecea;
  --hl:#fff1b8; --hl-line:#d9a400; --on-bad:#ffffff; --shadow:0 1px 2px rgba(16,40,28,.06),0 4px 16px rgba(16,40,28,.06);
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1513; --panel:#161e1b; --panel-2:#1b2521; --text:#e6ece9; --muted:#9aa9a2; --line:#27332e;
  --accent:#4cc38a; --accent-soft:#1d3a2c; --accent-text:#08110d;
  --client:#1f2925; --operator:#1d3a2c; --system:#262038; --system-text:#c3b5ef;
  --good:#5fd39a; --good-soft:#163526; --warn:#f1b34a; --warn-soft:#3a2c12; --bad:#ff8a80; --bad-soft:#3d1a18;
  --hl:#4a3f12; --hl-line:#e0b52a; --on-bad:#2b0a07; --shadow:none;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;overflow:hidden;margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

/* Top bar */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-text);font-style:normal;font-size:15px}
.pickers{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:2px}
.field span{font-size:12px;color:var(--muted)}
select,input[type=search]{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:180px}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{width:160px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* Layout */
.layout{display:grid;grid-template-columns:290px minmax(0,1fr) 440px;gap:16px;padding:16px 20px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
.pane-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.scroll{overflow:auto;min-height:0;flex:1}

/* Chat list */
.filters{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:3px 11px;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.only{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:10px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 16px}
.item:hover{background:var(--panel-2)}
.item.active{background:var(--accent-soft)}
.item .who{flex:1;min-width:0}
.item .id{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.done{background:var(--good)}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;flex:none;font-variant-numeric:tabular-nums}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.none{background:var(--panel-2);color:var(--muted)}
.flag{color:var(--bad);font-size:12px;font-weight:700}

/* Chat */
.chat-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chat-head h2{margin:0;font-size:17px}
.chat-head .meta{color:var(--muted);font-size:13px}
.messages{padding:18px 20px 30px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;display:flex;flex-direction:column;gap:3px;scroll-margin:120px}
.msg .bubble{padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word;border:2px solid transparent;transition:background .2s,border-color .2s}
.msg .label{font-size:12px;color:var(--muted);display:flex;gap:8px}
.msg .label b{font-weight:600;color:var(--text)}
.msg.CLIENT{align-self:flex-start}.msg.CLIENT .bubble{background:var(--client);border-top-left-radius:6px}
.msg.OPERATOR{align-self:flex-end}.msg.OPERATOR .label{justify-content:flex-end}.msg.OPERATOR .bubble{background:var(--operator);border-top-right-radius:6px}
.msg.BOT,.msg.SYSTEM,.msg.OTHER{align-self:center;max-width:88%;text-align:center}
.msg.BOT .bubble,.msg.SYSTEM .bubble,.msg.OTHER .bubble{background:var(--system);color:var(--system-text);font-size:13px;padding:6px 12px;border-radius:10px}
.msg.BOT .label,.msg.SYSTEM .label,.msg.OTHER .label{justify-content:center}
.msg.hl .bubble{background:var(--hl);border-color:var(--hl-line);color:var(--text)}
.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.notice{margin:14px 20px 0;padding:10px 14px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:14px}

/* Verdict */
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel-2)}
.score span{display:block;font-size:12px;color:var(--muted)}
.score b{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score b.good{color:var(--good)} .score b.mid{color:var(--warn)} .score b.bad{color:var(--bad)}
.state{margin-top:8px;font-size:13px;color:var(--muted)}
.banner{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:14px}
.section{padding:12px 16px 2px}
.section h3{margin:4px 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.crit{border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-bottom:10px;background:var(--panel)}
.crit.differs{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.crit-head{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.crit-head .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.crit-head .t{font-weight:600;flex:1}
.crit-head .w{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{position:relative;min-width:54px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:600}
.seg button:hover{border-color:var(--accent)}
.seg button[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.seg button[aria-checked=true].no{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.seg button .m{position:absolute;top:-8px;right:-6px;font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:99px;background:var(--warn);color:#fff}
.hint{font-size:13px;color:var(--muted);margin-top:7px}
.model{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--panel-2);color:var(--muted)}
.model.differs{background:var(--warn-soft);color:var(--text)}
.model b{color:var(--text)}
.turns{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle;margin-left:4px}
.turn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 6px;font-size:12px;font-variant-numeric:tabular-nums}
.turn:hover{border-color:var(--accent);color:var(--accent)}
details{margin-top:8px}
summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
textarea,input.ev{width:100%;margin-top:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{min-height:58px;resize:vertical}
.actions{position:sticky;bottom:0;display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius)}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn:disabled{opacity:.5;cursor:default}
.saved{font-size:13px;color:var(--good);align-self:center}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);font-weight:500;padding:6px 8px;font-size:13px}
.btn.ghost:hover{color:var(--accent);border-color:transparent}
.actions .row{display:flex;gap:8px;width:100%;flex-wrap:wrap;align-items:center}
.actions .row .btn.primary{flex:1}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.view[hidden]{display:none!important}

/* Results: overview strip */
.results-wrap{display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;padding:16px 20px;min-height:0}
.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,3fr);gap:12px;align-items:stretch}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi>b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi>b.good{color:var(--good)}.kpi>b.mid{color:var(--warn)}.kpi>b.bad{color:var(--bad)}
.bycrit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 18px;margin-top:6px}
.bycrit .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:12.5px;color:var(--muted);align-items:baseline}
.bycrit .row b{color:var(--text);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bycrit .meter{grid-column:1/-1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bycrit .meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.results{display:grid;grid-template-columns:330px minmax(0,1fr) minmax(0,1fr);gap:16px;min-height:0}

/* Criterion dots in the list */
.dots{display:flex;gap:3px;margin-top:4px}
.dots i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.dots i.y{background:var(--good)}.dots i.n{background:var(--bad)}.dots i.p{background:var(--warn)}.dots i.na{background:var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* Read-only verdict */
.rcrit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rcrit:last-child{border-bottom:0}
.badge{grid-row:span 2;align-self:start;min-width:64px;text-align:center;font-weight:700;font-size:13px;border-radius:10px;padding:6px 8px}
.badge.y{background:var(--good-soft);color:var(--good)}.badge.n{background:var(--bad-soft);color:var(--bad)}
.badge.p{background:var(--warn-soft);color:var(--warn)}.badge.na{background:var(--panel-2);color:var(--muted)}
.rcrit .t{font-weight:600}.rcrit .t small{font-weight:400;color:var(--muted);margin-left:6px}
.rcrit .why{font-size:14px;color:var(--muted)}
.result-actions{display:flex;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}

@media (max-width:1180px){body{display:block;height:auto;overflow:auto}.overview{grid-template-columns:repeat(2,minmax(0,1fr))}.overview .kpi:last-child{grid-column:1/-1}.results{grid-template-columns:1fr}.results .pane .scroll{max-height:70vh}.layout{grid-template-columns:250px minmax(0,1fr)}.verdict{grid-column:1/-1}.pane{max-height:none}.scroll{max-height:70vh}}
@media (max-width:760px){.layout{grid-template-columns:1fr;padding:12px}.results-wrap{padding:12px}.bycrit{grid-template-columns:1fr}.tabs{order:3}.progress{margin-left:0}.msg{max-width:92%}select,input[type=search]{min-width:0;width:100%}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i>✓</i>Контроль качества чатов</div>
  <div class="tabs" role="tablist"><button role="tab" data-view="results" aria-selected="true">Результаты</button><button role="tab" data-view="review" aria-selected="false">Проверка</button></div>
  <div class="pickers">
    <label class="field"><span>Набор диалогов</span><select id="dataset"></select></label>
    <label class="field"><span>Ответы модели</span><select id="preds"></select></label>
  </div>
  <div class="progress"><div class="bar" aria-hidden="true"><span id="bar" style="width:0"></span></div><span id="progress">—</span></div>
</header>

<main class="view results-wrap" id="resultsView">
  <div class="overview" id="overview"></div>
  <div class="results">
    <aside class="pane">
      <div class="pane-head">
        <input type="search" id="rsearch" placeholder="Поиск по номеру диалога" aria-label="Поиск по номеру диалога" style="width:100%">
        <div class="filters" id="rfilters" role="group" aria-label="Фильтр"></div>
        <div class="legend"><span><i style="background:var(--good)"></i>выполнено</span><span><i style="background:var(--warn)"></i>частично</span><span><i style="background:var(--bad)"></i>не выполнено</span><span><i style="background:var(--line)"></i>N/A</span></div>
      </div>
      <div class="scroll" id="rlist"></div>
    </aside>
    <section class="pane">
      <div class="pane-head" id="rsummary"><h2 style="margin:0;font-size:17px">Выберите диалог</h2></div>
      <div class="scroll" id="rverdict" style="padding:4px 16px"></div>
      <div class="result-actions"><button class="btn" id="toReview">✎ Исправить оценку</button></div>
    </section>
    <section class="pane">
      <div class="pane-head chat-head" id="rchatHead"><h2>Диалог</h2></div>
      <div class="scroll" id="rchat"></div>
    </section>
  </div>
</main>

<main class="view layout" id="reviewView" hidden>
  <aside class="pane">
    <div class="pane-head">
      <input type="search" id="search" placeholder="Поиск по номеру диалога" aria-label="Поиск по номеру диалога" style="width:100%">
      <div class="filters" id="langs" role="group" aria-label="Язык"></div>
      <label class="only"><input type="checkbox" id="onlyOpen"> Только непроверенные</label>
    </div>
    <div class="scroll" id="list"></div>
  </aside>

  <section class="pane">
    <div class="pane-head chat-head" id="chatHead"><h2>Диалог не выбран</h2></div>
    <div class="scroll" id="chat"><div class="empty"><b>Нет данных</b>Положите файл с диалогами (JSON) в папку <code>datasets</code> и обновите страницу.</div></div>
  </section>

  <section class="pane verdict">
    <div class="pane-head" id="summary"></div>
    <div class="scroll" id="form"></div>
    <div class="actions">
      <div class="row"><button class="btn primary" id="save" title="Ctrl+S">Сохранить проверку</button>
        <button class="btn" id="next" title="Следующий непроверенный диалог">Следующий →</button></div>
      <div class="row"><button class="btn ghost" id="reset">↺ Вернуть ответ модели</button>
        <button class="btn ghost" id="run" title="Заново оценить этот диалог моделью">⟳ Оценить моделью заново</button>
        <span class="saved" id="saved" aria-live="polite"></span></div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key = v => JSON.stringify(v);
const SECTIONS = [
  ['Начало и понимание запроса', ['contact','discovery']],
  ['Безопасность и решение', ['identification','consultation']],
  ['Ведение и завершение диалога', ['empathy','dialogue','closure']],
  ['Грубые нарушения', ['critical']],
];
const LEVELS = {  // официальные описания ступеней (чек-лист, стр. 2)
  consultation: {20:'Все существенные вопросы закрыты или дан корректный следующий шаг.',15:'Основной вопрос решён, пропущена второстепенная деталь.',10:'Часть запроса закрыта, существенный вопрос остался открытым.',5:'Есть общая подсказка, но клиенту всё ещё непонятно, как действовать.',0:'Ответа по существу нет или ключевая рекомендация ошибочна.','null':'Чат закончился до того, как клиент сформулировал запрос.'},
  dialogue: {10:'Ответы ясные и связные. Если было явное ожидание, оператор предупредил.',7:'Один заметный сбой, но клиент может понять ответ и продолжить.',4:'Клиенту приходится переспрашивать из-за формулировок или порядка ответов.',0:'Из-за бессвязных или противоречивых реплик ход диалога непонятен.'},
};
const WHO = {CLIENT:'Клиент', OPERATOR:'Оператор', BOT:'Бот', SYSTEM:'Система'};
const S = {checklist:[], convs:[], preds:{}, labels:{}, cur:null, form:{}, dirty:false, lang:''};

const word = (code, v) => v === null ? 'N/A' : v === true ? (code === 'critical' ? 'Есть' : 'Да') : v === false ? (code === 'critical' ? 'Нет' : 'Нет') : String(v);
const tone = s => s == null ? 'none' : s >= 80 ? 'good' : s >= 50 ? 'mid' : 'bad';
const fmtTime = t => { const m = /T(\d\d:\d\d:\d\d)/.exec(t || ''); return m ? m[1] : (t || ''); };
const api = async (path, opt) => { const r = await fetch(path, opt); const j = await r.json().catch(() => ({error: r.statusText})); if (!r.ok) throw new Error(j.error || r.statusText); return j; };
const post = (path, body) => api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
const remember = () => { try { localStorage.setItem('cqa-view', JSON.stringify({dataset: $('#dataset').value, preds: $('#preds').value})); } catch {} };

async function init() {
  S.checklist = await api('/api/checklist');
  const ds = await api('/api/datasets');
  const pf = await api('/api/prediction-files');
  $('#dataset').innerHTML = ds.map(d => `<option value="${esc(d.name)}">${esc(d.name)} · ${d.count}${d.error ? ' ⚠' : ''}</option>`).join('');
  $('#preds').innerHTML = '<option value="">— без ответов модели —</option>' + pf.map(f => `<option>${esc(f)}</option>`).join('');
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('cqa-view') || '{}'); } catch {}
  if (saved.dataset && ds.some(d => d.name === saved.dataset)) $('#dataset').value = saved.dataset;
  if (saved.preds && pf.includes(saved.preds)) $('#preds').value = saved.preds;
  else { const g = pf.find(f => f.includes(($('#dataset').value || '').replace('.json', ''))); if (g) $('#preds').value = g; }
  if (ds.length) await loadDataset();
}
async function loadDataset() {
  const name = $('#dataset').value; if (!name) return; remember();
  S.convs = await api('/api/dataset?name=' + encodeURIComponent(name));
  S.labels = await api('/api/labels?name=' + encodeURIComponent(name));
  await loadPreds();
  const langs = [...new Set(S.convs.map(c => c.language).filter(Boolean))];
  $('#langs').innerHTML = ['', ...langs].map(l => `<button class="chip" data-lang="${l}" aria-pressed="${S.lang === l}">${l || 'Все'}</button>`).join('');
  renderList();
  if (S.convs.length) select(S.convs[0].id, true);
  renderResults();
}
async function loadPreds() { const f = $('#preds').value; remember(); S.preds = f ? await api('/api/predictions?file=' + encodeURIComponent(f)) : {}; }

function visible() {
  const q = $('#search').value.trim().toLowerCase(), open = $('#onlyOpen').checked;
  return S.convs.filter(c => (!q || c.id.toLowerCase().includes(q)) && (!S.lang || c.language === S.lang) && (!open || !S.labels[c.id]?.reviewed));
}
function renderList() {
  const done = S.convs.filter(c => S.labels[c.id]?.reviewed).length;
  $('#progress').textContent = `Проверено ${done} из ${S.convs.length}`;
  $('#bar').style.width = S.convs.length ? (100 * done / S.convs.length) + '%' : '0';
  const rows = visible().map(c => {
    const p = S.preds[c.id], s = p?.status === 'ok' ? p.score.final_score : null;
    const pill = p ? (p.status === 'ok' ? `<span class="pill ${tone(s)}">${s ?? '—'}</span>` : '<span class="pill bad">ошибка</span>') : '';
    return `<button class="item ${S.cur?.id === c.id ? 'active' : ''}" data-id="${esc(c.id)}">
      <span class="dot ${S.labels[c.id]?.reviewed ? 'done' : ''}" title="${S.labels[c.id]?.reviewed ? 'Проверено' : 'Не проверено'}"></span>
      <span class="who"><div class="id">${esc(c.id)}</div><div class="meta">${esc(c.language)} · ${c.channel === 'voice call' ? 'звонок' : 'чат'}${p?.score?.critical_flag ? ' · <span class="flag">грубая ошибка</span>' : ''}${c.error ? ' · <span class="flag">не оценить</span>' : ''}</div></span>${pill}</button>`;
  }).join('');
  $('#list').innerHTML = rows || '<div class="empty">Ничего не найдено</div>';
}

function predCriteria(id) { const p = S.preds[id]; return p?.status === 'ok' ? Object.fromEntries(p.criteria.map(x => [x.criterion_id, x])) : {}; }
function formFor(c) {
  const l = S.labels[c.id], pc = predCriteria(c.id), out = {};
  for (const k of S.checklist) {
    const src = l?.criteria?.[k.code] || pc[k.code];
    out[k.code] = src ? {value: src.value, rationale: src.rationale || '', evidence_turns: [...(src.evidence_turns || [])]} : {value: undefined, rationale: '', evidence_turns: []};
  }
  return out;
}
function select(id, force) {
  if (!force && S.dirty && !confirm('Изменения не сохранены. Перейти к другому диалогу?')) return;
  const c = S.convs.find(x => x.id === id); if (!c) return;
  S.cur = c; S.form = formFor(c); S.dirty = false; $('#saved').textContent = '';
  renderList(); renderChat(); renderForm();
  document.querySelector('.item.active')?.scrollIntoView({block: 'nearest'});
}

function renderChat(hl = []) {
  const c = S.cur;
  $('#chatHead').innerHTML = `<h2>${esc(c.id)}</h2><span class="meta">${esc(c.language)} · ${c.channel === 'voice call' ? 'звонок' : 'чат'} · реплик: ${c.turns.length}</span>`;
  $('#chat').innerHTML = (c.error ? `<div class="notice">Этот диалог нельзя оценить: ${esc(c.error)}</div>` : '') + '<div class="messages">' + c.turns.map(t => {
    const role = WHO[t.speaker] ? t.speaker : 'OTHER';
    return `<div class="msg ${role} ${hl.includes(t.n) ? 'hl' : ''}" id="t${t.n}"><div class="label"><span class="num">[${t.n}]</span><b>${esc(WHO[t.speaker] || t.speaker)}</b><span>${esc(fmtTime(t.ts))}</span></div><div class="bubble">${esc(t.text)}</div></div>`;
  }).join('') + '</div>';
}
function highlight(turns, scroll) {
  document.querySelectorAll('.msg.hl').forEach(e => e.classList.remove('hl'));
  turns.forEach(n => document.getElementById('t' + n)?.classList.add('hl'));
  if (scroll && turns.length) document.getElementById('t' + turns[0])?.scrollIntoView({behavior: 'smooth', block: 'center'});
}
const turnChips = turns => `<span class="turns">${turns.map(n => `<button class="turn" data-turn="${n}" title="Показать реплику ${n}">${n}</button>`).join('')}</span>`;

async function renderSummary() {
  const c = S.cur, p = S.preds[c.id], l = S.labels[c.id];
  const model = p ? (p.status === 'ok' ? p.score.final_score : null) : undefined;
  const values = Object.fromEntries(Object.entries(S.form).map(([k, v]) => [k, v.value]));
  let ours = null;
  if (Object.values(values).every(v => v !== undefined)) { try { ours = (await post('/api/score', {values})).final_score; } catch {} }
  const critical = values.critical === true || p?.score?.critical_flag;
  $('#summary').innerHTML = `<div class="scores">
      <div class="score"><span>Оценка модели</span><b class="${tone(model)}">${model === undefined ? '—' : model ?? 'ошибка'}</b></div>
      <div class="score"><span>Итог проверки</span><b class="${tone(ours)}">${ours ?? '—'}</b></div></div>
    <div class="state">${l ? (l.reviewed ? '✓ Проверено' : 'Черновик') + (l.updated ? ' · ' + esc(new Date(l.updated).toLocaleString('ru-RU')) : '') : 'Ещё не проверено — ниже ответы модели, исправьте при необходимости.'}</div>
    ${critical ? '<div class="banner">⚠ Грубая ошибка оператора</div>' : ''}
    ${p && p.status !== 'ok' ? `<div class="banner">Модель не смогла оценить диалог: ${esc(p.error)}</div>` : ''}`;
}
function renderForm() {
  const pc = predCriteria(S.cur.id);
  const byCode = Object.fromEntries(S.checklist.map(k => [k.code, k]));
  $('#form').innerHTML = SECTIONS.map(([title, codes]) => `<div class="section"><h3>${title}</h3>${codes.filter(c => byCode[c]).map(code => {
    const k = byCode[code], f = S.form[code], m = pc[code];
    const differs = m && f.value !== undefined && key(m.value) !== key(f.value);
    const buttons = k.allowed.map(v => {
      const on = f.value !== undefined && key(v) === key(f.value), bad = (v === false && code !== 'critical') || (v === true && code === 'critical') || v === 0;
      return `<button role="radio" aria-checked="${on}" class="${bad ? 'no' : ''}" data-v='${key(v)}'>${word(code, v)}${m && key(m.value) === key(v) ? '<span class="m" title="Ответ модели">М</span>' : ''}</button>`;
    }).join('');
    const hint = LEVELS[code] && f.value !== undefined ? `<div class="hint">${LEVELS[code][String(f.value)] || ''}</div>` : '';
    const modelNote = m ? `<div class="model ${differs ? 'differs' : ''}">${differs ? `<b>Модель ответила иначе: ${word(code, m.value)}.</b> ` : '<b>Модель:</b> '}${esc(m.rationale)}${m.evidence_turns.length ? turnChips(m.evidence_turns) : ''}</div>` : '';
    return `<div class="crit ${differs ? 'differs' : ''}" data-code="${code}">
      <div class="crit-head"><span class="n">${k.number}</span><span class="t">${esc(k.title)}</span><span class="w">${k.weight ? 'вес ' + k.weight : 'без баллов'}</span></div>
      <div class="seg" role="radiogroup" aria-label="${esc(k.title)}">${buttons}</div>${hint}${modelNote}
      <details><summary>Обоснование и реплики-доказательства</summary>
        <textarea class="rat" placeholder="Почему выбрано это значение">${esc(f.rationale)}</textarea>
        <input class="ev" value="${esc(f.evidence_turns.join(', '))}" placeholder="Номера реплик через запятую, например: 3, 5" aria-label="Номера реплик"></details>
    </div>`;
  }).join('')}</div>`).join('');
  renderSummary();
  const hasModel = Object.keys(pc).length > 0;
  $('#reset').disabled = !hasModel;
}

function changed() { S.dirty = true; $('#saved').textContent = ''; }
$('#form').addEventListener('click', e => {
  const t = e.target.closest('.turn'); if (t) { highlight([+t.dataset.turn], true); return; }
  const b = e.target.closest('.seg button'); if (!b) return;
  const code = b.closest('.crit').dataset.code;
  S.form[code].value = JSON.parse(b.dataset.v); changed(); renderForm();
});
$('#form').addEventListener('input', e => {
  const card = e.target.closest('.crit'); if (!card) return; const code = card.dataset.code;
  if (e.target.classList.contains('rat')) S.form[code].rationale = e.target.value;
  if (e.target.classList.contains('ev')) { S.form[code].evidence_turns = e.target.value.split(/[^0-9]+/).filter(Boolean).map(Number); highlight(S.form[code].evidence_turns, false); }
  changed();
});
$('#form').addEventListener('mouseover', e => { const card = e.target.closest('.crit'); if (card) highlight(S.form[card.dataset.code].evidence_turns, false); });

async function save() {
  const c = S.cur; if (!c) return;
  const missing = S.checklist.filter(k => S.form[k.code].value === undefined).map(k => k.number);
  if (missing.length) { $('#saved').textContent = 'Выберите ответ по критериям: ' + missing.join(', '); $('#saved').style.color = 'var(--bad)'; return; }
  try {
    S.labels[c.id] = await post('/api/labels?name=' + encodeURIComponent($('#dataset').value), {conversation_id: c.id, criteria: S.form, reviewed: true});
    S.dirty = false; renderList(); renderSummary();
    $('#saved').style.color = ''; $('#saved').textContent = '✓ Сохранено';
  } catch (e) { $('#saved').style.color = 'var(--bad)'; $('#saved').textContent = 'Не удалось сохранить: ' + e.message; }
}
function nextOpen() {
  const list = visible(), i = list.findIndex(c => c.id === S.cur?.id);
  const n = [...list.slice(i + 1), ...list.slice(0, Math.max(i, 0))].find(c => !S.labels[c.id]?.reviewed);
  if (n) select(n.id); else { $('#saved').style.color = ''; $('#saved').textContent = 'Все диалоги проверены 🎉'; }
}
async function runModel() {
  const c = S.cur, b = $('#run'); b.disabled = true; b.textContent = 'Оценка… (до минуты)';
  try { S.preds[c.id] = await api(`/api/evaluate?name=${encodeURIComponent($('#dataset').value)}&id=${encodeURIComponent(c.id)}`, {method: 'POST'}); if (!S.labels[c.id]) S.form = formFor(c); renderList(); renderForm(); }
  catch (e) { $('#saved').style.color = 'var(--bad)'; $('#saved').textContent = 'Ошибка модели: ' + e.message; }
  finally { b.disabled = false; b.textContent = '⟳ Оценить моделью заново'; }
}

$('#save').onclick = save;
$('#next').onclick = nextOpen;
$('#run').onclick = runModel;
$('#reset').onclick = () => { const pc = predCriteria(S.cur.id); for (const [k, x] of Object.entries(pc)) S.form[k] = {value: x.value, rationale: x.rationale, evidence_turns: [...x.evidence_turns]}; changed(); renderForm(); };
$('#dataset').onchange = loadDataset;
$('#preds').onchange = async () => { await loadPreds(); renderList(); if (S.cur) select(S.cur.id, true); S.rcur = null; renderResults(); };
$('#search').oninput = renderList;
$('#onlyOpen').onchange = renderList;
$('#langs').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; S.lang = b.dataset.lang; document.querySelectorAll('#langs .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); renderList(); };
$('#list').onclick = e => { const it = e.target.closest('.item'); if (it) select(it.dataset.id); };
$('#chat').onclick = () => highlight([], false);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && S.view === 'results') {
    const list = rVisible(), i = list.findIndex(r => r.id === S.rcur), n = list[i + (e.key === 'ArrowDown' ? 1 : -1)];
    if (n) { e.preventDefault(); showResult(n.id); document.querySelector('#rlist .item.active')?.scrollIntoView({block: 'nearest'}); }
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const list = visible(), i = list.findIndex(c => c.id === S.cur?.id), n = list[i + (e.key === 'ArrowDown' ? 1 : -1)];
    if (n) { e.preventDefault(); select(n.id); }
  }
});

/* ---------- Результаты (только просмотр) ---------- */
S.view = 'results'; S.rcur = null; S.rfilter = '';
const valueClass = (code, v) => v === null ? 'na' : code === 'critical' ? (v ? 'n' : 'y') : v === true ? 'y' : v === false ? 'n' : (v === 0 ? 'n' : (v === 20 || v === 10) ? 'y' : 'p');
const valueText = (code, v) => v === null ? 'N/A' : code === 'critical' ? (v ? 'Есть' : 'Нет') : v === true ? 'Да' : v === false ? 'Нет' : `${v} из ${code === 'consultation' ? 20 : 10}`;
const SHORT = {contact:'Контакт', discovery:'Потребность', identification:'Идентификация', consultation:'Консультация', empathy:'Эмпатия', dialogue:'Ведение диалога', closure:'Завершение', critical:'Грубые ошибки'};
function resultRows() {
  const ids = S.convs.length ? S.convs.map(c => c.id) : Object.keys(S.preds);
  return ids.map(id => ({id, conv: S.convs.find(c => c.id === id), p: S.preds[id]})).filter(r => r.p);
}
function renderOverview() {
  const rows = resultRows(), ok = rows.filter(r => r.p.status === 'ok');
  if (!rows.length) { $('#overview').innerHTML = '<div class="kpi" style="grid-column:1/-1"><span>Нет результатов</span>Выберите файл с ответами модели вверху страницы (например <b>results/dev/results.json</b>). Файл создаёт команда <code>python run.py evaluate</code>.</div>'; return; }
  const scores = ok.map(r => r.p.score.final_score).filter(x => x != null);
  const avg = scores.length ? Math.round(100 * scores.reduce((a, b) => a + b, 0) / scores.length) / 100 : null;
  const crit = ok.filter(r => r.p.score.critical_flag).length, err = rows.length - ok.length;
  const per = S.checklist.map(k => {
    const vals = ok.map(r => r.p.criteria.find(c => c.criterion_id === k.code)?.value).filter(v => v !== undefined && v !== null);
    let share = null, text = '—';
    if (vals.length) {
      if (k.code === 'critical') { share = vals.filter(v => v === false).length / vals.length; text = `${vals.filter(v => v).length} с ошибкой`; }
      else if (typeof vals[0] === 'boolean') { share = vals.filter(v => v).length / vals.length; text = `${Math.round(100 * share)}% «Да»`; }
      else { const mx = k.code === 'consultation' ? 20 : 10; share = vals.reduce((a, b) => a + b, 0) / vals.length / mx; text = `${Math.round(10 * share * mx) / 10} из ${mx}`; }
    }
    return `<div class="row"><span>${k.number} ${SHORT[k.code] || esc(k.title)}</span><b>${text}</b><div class="meter"><i style="width:${share == null ? 0 : Math.round(100 * share)}%"></i></div></div>`;
  }).join('');
  $('#overview').innerHTML = `
    <div class="kpi"><span>Диалогов</span><b>${rows.length}</b></div>
    <div class="kpi"><span>Средний балл</span><b class="${tone(avg)}">${avg ?? '—'}</b></div>
    <div class="kpi"><span>С грубыми ошибками</span><b class="${crit ? 'bad' : ''}">${crit}</b></div>
    <div class="kpi"><span>Не удалось оценить</span><b class="${err ? 'bad' : ''}">${err}</b></div>
    <div class="kpi"><span>По критериям</span><div class="bycrit">${per}</div></div>`;
  const langs = [...new Set(rows.map(r => r.conv?.language).filter(Boolean))];
  const opts = [['', 'Все'], ...langs.map(l => [l, l]), ['critical', 'Грубые ошибки'], ['low', 'Балл ниже 60']];
  $('#rfilters').innerHTML = opts.map(([v, t]) => `<button class="chip" data-f="${v}" aria-pressed="${S.rfilter === v}">${t}</button>`).join('');
}
function rVisible() {
  const q = $('#rsearch').value.trim().toLowerCase(), f = S.rfilter;
  return resultRows().filter(r => (!q || r.id.toLowerCase().includes(q)) && (!f
    || (f === 'critical' && r.p.score?.critical_flag) || (f === 'low' && r.p.status === 'ok' && (r.p.score.final_score ?? 100) < 60)
    || r.conv?.language === f));
}
function renderResultList() {
  const html = rVisible().map(r => {
    const ok = r.p.status === 'ok', s = ok ? r.p.score.final_score : null;
    const dots = ok ? `<div class="dots">${r.p.criteria.map(c => `<i class="${valueClass(c.criterion_id, c.value)}" title="${esc(SHORT[c.criterion_id])}: ${valueText(c.criterion_id, c.value)}"></i>`).join('')}</div>` : '';
    return `<button class="item ${S.rcur === r.id ? 'active' : ''}" data-id="${esc(r.id)}"><span class="who"><div class="id">${esc(r.id)}</div>
      <div class="meta">${esc(r.conv?.language || '')}${r.conv ? ' · ' + (r.conv.channel === 'voice call' ? 'звонок' : 'чат') : ''}${ok && r.p.score.critical_flag ? ' · <span class="flag">грубая ошибка</span>' : ''}${ok ? '' : ' · <span class="flag">не оценён</span>'}</div>${dots}</span>
      <span class="pill ${ok ? tone(s) : 'bad'}">${ok ? (s ?? '—') : 'ошибка'}</span></button>`;
  }).join('');
  $('#rlist').innerHTML = html || '<div class="empty">Ничего не найдено</div>';
}
function rHighlight(turns) {
  document.querySelectorAll('#rchat .msg.hl').forEach(e => e.classList.remove('hl'));
  turns.forEach(n => document.getElementById('r' + n)?.classList.add('hl'));
  if (turns.length) document.getElementById('r' + turns[0])?.scrollIntoView({behavior: 'smooth', block: 'center'});
}
function showResult(id) {
  S.rcur = id; renderResultList();
  const p = S.preds[id], conv = S.convs.find(c => c.id === id);
  const ok = p.status === 'ok', s = ok ? p.score.final_score : null;
  $('#rsummary').innerHTML = `<div class="scores" style="grid-template-columns:1fr">
      <div class="score"><span>${esc(id)} · итоговый балл</span><b class="${ok ? tone(s) : 'bad'}">${ok ? (s ?? 'не рассчитан') : 'не оценён'}</b></div></div>
    ${ok && p.score.critical_flag ? '<div class="banner">⚠ Грубая ошибка оператора</div>' : ''}
    ${ok ? '' : `<div class="banner">Модель не смогла оценить диалог: ${esc(p.error)}</div>`}`;
  const byCode = Object.fromEntries((p.criteria || []).map(c => [c.criterion_id, c]));
  $('#rverdict').innerHTML = ok ? SECTIONS.map(([title, codes]) => `<div class="section" style="padding:10px 0 0"><h3>${title}</h3>${codes.map(code => {
    const c = byCode[code], k = S.checklist.find(x => x.code === code); if (!c || !k) return '';
    return `<div class="rcrit"><span class="badge ${valueClass(code, c.value)}">${valueText(code, c.value)}</span>
      <div class="t">${k.number} ${esc(k.title)}<small>${k.weight ? 'вес ' + k.weight : 'без баллов'}</small></div>
      <div class="why">${esc(c.rationale)}${c.evidence_turns.length && conv ? turnChips(c.evidence_turns) : ''}</div></div>`;
  }).join('')}</div>`).join('') : '';
  $('#rchatHead').innerHTML = conv ? `<h2>Диалог</h2><span class="meta">${esc(conv.language)} · ${conv.channel === 'voice call' ? 'звонок' : 'чат'} · реплик: ${conv.turns.length}</span>` : '<h2>Диалог</h2>';
  $('#rchat').innerHTML = conv ? '<div class="messages">' + conv.turns.map(t => {
    const role = WHO[t.speaker] ? t.speaker : 'OTHER';
    return `<div class="msg ${role}" id="r${t.n}"><div class="label"><span class="num">[${t.n}]</span><b>${esc(WHO[t.speaker] || t.speaker)}</b><span>${esc(fmtTime(t.ts))}</span></div><div class="bubble">${esc(t.text)}</div></div>`;
  }).join('') + '</div>' : '<div class="empty">Текст диалога не найден: выберите вверху набор диалогов, к которому относятся эти результаты.</div>';
  $('#toReview').disabled = !conv;
}
function renderResults() {
  renderOverview(); renderResultList();
  const rows = rVisible();
  if (rows.length && !rows.some(r => r.id === S.rcur)) showResult(rows[0].id);
  else if (S.rcur && S.preds[S.rcur]) showResult(S.rcur);
  else { $('#rverdict').innerHTML = ''; $('#rchat').innerHTML = ''; }
}
function setView(v) {
  S.view = v;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === v));
  $('#resultsView').hidden = v !== 'results'; $('#reviewView').hidden = v !== 'review';
  $('.progress').style.visibility = v === 'review' ? 'visible' : 'hidden';
  try { localStorage.setItem('cqa-tab', v); } catch {}
}
document.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (b) setView(b.dataset.view); };
$('#rlist').onclick = e => { const it = e.target.closest('.item'); if (it) showResult(it.dataset.id); };
$('#rverdict').onclick = e => { const t = e.target.closest('.turn'); if (t) rHighlight([+t.dataset.turn]); };
$('#rsearch').oninput = renderResultList;
$('#rfilters').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; S.rfilter = b.dataset.f; document.querySelectorAll('#rfilters .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); renderResultList(); };
$('#toReview').onclick = () => { if (!S.rcur) return; setView('review'); select(S.rcur); };
try { const t = localStorage.getItem('cqa-tab'); if (t === 'review') setView('review'); else setView('results'); } catch { setView('results'); }

window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
init().catch(e => { $('#chat').innerHTML = `<div class="empty"><b>Не удалось загрузить</b>${esc(e.message)}</div>`; });
</script>
</body>
</html>
