<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamics 365 Host Emulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f3f2f1;
            overflow: hidden;
        }

        /* Эмуляция левой панели Dynamics 365 */
        .d365-nav {
            width: 48px;
            background-color: #002050;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 16px;
            color: #fff;
        }

        .d365-nav-icon {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Главная область Dynamics 365 */
        .d365-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #faf9f8;
        }

        /* Верхняя шапка CRM */
        .d365-header {
            height: 44px;
            background-color: #0078d4;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Панель формы сущности (например, Обращение / Звонок) */
        .d365-form-header {
            background-color: #ffffff;
            border-bottom: 1px solid #e1dfdd;
            padding: 12px 24px;
        }

        .d365-form-title {
            font-size: 18px;
            font-weight: 600;
            color: #323130;
        }

        .d365-form-sub {
            font-size: 12px;
            color: #605e5c;
        }

        /* Контейнер для HTML Web Resource */
        .d365-content-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .d365-web-resource-card {
            flex: 1;
            background: #ffffff;
            border: 1px solid #e1dfdd;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 1.6px 3.6px 0 rgba(0,0,0,0.132);
        }

        .d365-card-title {
            padding: 8px 12px;
            background-color: #f3f2f1;
            border-bottom: 1px solid #e1dfdd;
            font-size: 12px;
            font-weight: 600;
            color: #605e5c;
            text-transform: uppercase;
        }

        /* Сам iframe, в который зашивается ваш CQA Studio */
        .d365-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<!-- Навигация CRM -->
<div class="d365-nav">
    <div class="d365-nav-icon"></div>
    <div class="d365-nav-icon"></div>
    <div class="d365-nav-icon"></div>
</div>

<!-- Основной контент CRM -->
<div class="d365-main">
    <div class="d365-header">
        Dynamics 365 | Customer Service Hub (Эмулятор)
    </div>

    <div class="d365-form-header">
        <div class="d365-form-title">Звонок</div>
        <div class="d365-form-sub">Форма сущности «Обращение клиентов»</div>
    </div>

    <div class="d365-content-area">
        <div class="d365-web-resource-card">
            <div class="d365-card-title">CQA Studio — HTML Web Resource (embedded mode)</div>

            <!-- Подключаем ваш index.html (который использует app.js) в режиме embed=1 -->
            <iframe
                    class="d365-iframe"
                    src="http://127.0.0.1:4173/?embed=1"
                    title="CQA Studio">
            </iframe>
        </div>
    </div>
</div>

</body>
</html>
